services:
  node:
    container_name: ${DOCKER_PROJECT_NAME}_node
    image: node:20-alpine3.21
    volumes:
      - ./:/var/www/html
    working_dir: /var/www/html
    # Konteyner ichida npm run build Vite uchun VITE_* ni process.env dan oladi
    env_file:
      - .env
    command: /bin/sh -c "npm install && npm run build"
